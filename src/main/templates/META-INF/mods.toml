modLoader = "javafml"
loaderVersion = "[2,)"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    description = '''${mod_description}'''
    authors = "${mod_author}"
    logoFile = "assets/windy/icon.png"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    mandatory = true
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${mc}"
    ordering = "NONE"
    side = "BOTH"