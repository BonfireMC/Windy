buildscript {
    repositories {
        mavenCentral()
        maven {
            name = 'MinecraftForge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '6.0.26', changing: true
        classpath group: 'org.spongepowered', name: 'mixingradle', version: '0.7-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

version = "${mod_version}-forge"
group = 'xyz.bonfiremc'

base {
    archivesName = 'windy'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

compileJava.options.encoding = 'UTF-8'

repositories {
    mavenCentral()
    maven {
        name = 'IsXander'
        url = 'https://maven.isxander.dev/releases'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            arg '-mixin.config=windy.mixins.json'

            mods {
                windy {
                    source sourceSets.main
                }
            }
        }
    }
}

mixin {
    add sourceSets.main, 'windy.refmap.json'
    config 'windy.mixins.json'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf('dev.isxander.yacl:yet-another-config-lib-forge:3.2.2+1.20')

    compileOnly 'org.jetbrains:annotations:24.0.1'
    compileOnly 'org.spongepowered:mixin:0.8.5'

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    manifest {
        attributes([
                'Specification-Title'    : 'windy',
                'Specification-Vendor'   : 'BonfireMC',
                'Specification-Version'  : '1',
                'Implementation-Title'   : 'Windy',
                'Implementation-Version' : project.version,
                'Implementation-Vendor'  : 'BonfireMC',
        ])
    }
}
